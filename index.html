<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Online Store</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

header{
    background:#111;
    color:white;
    padding:18px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:10;
}

header h1{
    margin:0 0 8px;
}

button{
    cursor:pointer;
}

.cartBtn,
.adminBtn{
    border:0;
    padding:10px 15px;
    border-radius:8px;
    margin:4px;
}

.cartBtn{
    background:#25d366;
    color:white;
}

.adminBtn{
    background:#ffc107;
    color:#111;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    padding:20px;
}

.product{
    background:white;
    border-radius:12px;
    padding:12px;
    box-shadow:0 2px 8px #ccc;
}

.product img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:10px;
}

.product h3{
    margin:10px 0 5px;
}

.price{
    font-size:20px;
    font-weight:bold;
    margin:7px 0;
}

.product button{
    width:100%;
    padding:11px;
    border:0;
    border-radius:8px;
    background:#111;
    color:white;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:50;
    padding:20px;
    overflow:auto;
}

.box{
    background:white;
    max-width:600px;
    margin:30px auto;
    padding:20px;
    border-radius:15px;
}

.close{
    float:right;
    background:#e53935;
    color:white;
    border:0;
    padding:7px 12px;
    border-radius:6px;
}

input,
textarea{
    width:100%;
    padding:11px;
    margin:7px 0;
    border:1px solid #bbb;
    border-radius:7px;
}

.action{
    width:100%;
    padding:13px;
    border:0;
    border-radius:8px;
    margin-top:8px;
    font-weight:bold;
}

.whatsapp{
    background:#25d366;
    color:white;
}

.pay{
    background:#4285f4;
    color:white;
}

.danger{
    background:#e53935;
    color:white;
}

.add{
    background:#111;
    color:white;
}

.cartItem{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid #ddd;
}

.qty button{
    padding:4px 9px;
    margin:2px;
}

.total{
    font-size:22px;
    font-weight:bold;
    margin-top:15px;
}

.small{
    color:#666;
    font-size:13px;
}
</style>
</head>

<body>

<header>

<h1>My Online Store</h1>

<button class="cartBtn" onclick="openCart()">
🛒 Cart (<span id="cartCount">0</span>)
</button>

<button class="adminBtn" onclick="openAdminLogin()">
🔐 Admin
</button>

</header>

<div class="products" id="products"></div>


<!-- CART -->

<div class="modal" id="cartModal">

<div class="box">

<button class="close" onclick="closeModal('cartModal')">X</button>

<h2>🛒 Your Cart</h2>

<div id="cartItems"></div>

<div class="total">
Total: ₹<span id="cartTotal">0</span>
</div>

<hr>

<h3>Customer Details</h3>

<input id="customerName" placeholder="Your Name">

<input id="customerPhone" placeholder="Mobile Number">

<textarea id="customerAddress"
placeholder="Delivery Address"></textarea>


<!-- WHATSAPP ORDER -->

<button class="action whatsapp" onclick="whatsappOrder()">
🟢 WhatsApp Order
</button>


<!-- PAY ON ORDER -->

<button class="action pay" onclick="payOnOrder()">
💳 Pay on Order — Google Pay / UPI
</button>

<p class="small">
Your cart total will be automatically added to the UPI payment request.
</p>

</div>
</div>


<!-- ADMIN LOGIN -->

<div class="modal" id="loginModal">

<div class="box">

<button class="close" onclick="closeModal('loginModal')">X</button>

<h2>🔐 Admin Login</h2>

<input
type="text"
id="adminUser"
placeholder="Username">

<input
type="password"
id="adminPass"
placeholder="Password">

<button class="action add" onclick="adminLogin()">
Login
</button>

</div>
</div>


<!-- ADMIN PANEL -->

<div class="modal" id="adminModal">

<div class="box">

<button class="close" onclick="closeModal('adminModal')">X</button>

<h2>⚙️ Admin Panel</h2>

<input
id="pName"
placeholder="Product Name">

<input
id="pPrice"
type="number"
placeholder="Price">

<input
id="pStock"
type="number"
placeholder="Stock">

<input
id="pImage"
placeholder="Image URL">

<button class="action add" onclick="addProduct()">
➕ Add Product
</button>

<hr>

<h3>Products</h3>

<div id="adminProducts"></div>

</div>
</div>


<script>

/* =====================================
   YOUR PAYMENT & WHATSAPP SETTINGS
===================================== */

const UPI_ID = "bahadursingh63036-1@oksbi";

const WHATSAPP_NUMBER = "919041205060";


/* =====================================
   PRODUCTS
===================================== */

let products =
JSON.parse(localStorage.getItem("products")) || [

{
id:1,
name:"Premium Wireless AirBuds",
price:999,
stock:10,
image:"https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?auto=format&fit=crop&w=600&q=80"
},

{
id:2,
name:"Smart Watch",
price:1499,
stock:8,
image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80"
},

{
id:3,
name:"Bluetooth Speaker",
price:799,
stock:12,
image:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=600&q=80"
}

];


let cart =
JSON.parse(localStorage.getItem("cart")) || [];


/* =====================================
   SAVE
===================================== */

function saveProducts(){

localStorage.setItem(
"products",
JSON.stringify(products)
);

}

function saveCart(){

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

}


/* =====================================
   DISPLAY PRODUCTS
===================================== */

function renderProducts(){

const box =
document.getElementById("products");

box.innerHTML="";

products.forEach(p=>{

box.innerHTML += `

<div class="product">

<img
src="${p.image}"
alt="${p.name}">

<h3>${p.name}</h3>

<div class="price">
₹${p.price}
</div>

<div class="small">
Stock: ${p.stock}
</div>

<br>

<button
onclick="addToCart(${p.id})"
${p.stock<=0 ? "disabled" : ""}>

${p.stock<=0
? "Out of Stock"
: "Add to Cart"}

</button>

</div>

`;

});

}


/* =====================================
   ADD TO CART
===================================== */

function addToCart(id){

const product =
products.find(p=>p.id===id);

if(!product || product.stock<=0){

alert("Product is out of stock.");

return;

}

const existing =
cart.find(i=>i.id===id);

if(existing){

if(existing.qty >= product.stock){

alert("Stock limit reached.");

return;

}

existing.qty++;

}else{

cart.push({
id:id,
qty:1
});

}

saveCart();

updateCart();

alert("Product added to cart.");

}


/* =====================================
   CART
===================================== */

function updateCart(){

document.getElementById("cartCount").innerText =
cart.reduce(
(sum,i)=>sum+i.qty,
0
);

}


function openCart(){

renderCart();

document.getElementById("cartModal")
.style.display="block";

}


function renderCart(){

const box =
document.getElementById("cartItems");

box.innerHTML="";

let total=0;

cart.forEach(item=>{

const product =
products.find(p=>p.id===item.id);

if(!product) return;

const amount =
product.price * item.qty;

total += amount;

box.innerHTML += `

<div class="cartItem">

<div>

<b>${product.name}</b>

<br>

₹${product.price} × ${item.qty}

</div>

<div class="qty">

<button
onclick="changeQty(${item.id},-1)">
−
</button>

${item.qty}

<button
onclick="changeQty(${item.id},1)">
+
</button>

<button
onclick="removeFromCart(${item.id})">
❌
</button>

</div>

</div>

`;

});

document.getElementById("cartTotal")
.innerText=total;

}


function changeQty(id,change){

const item =
cart.find(i=>i.id===id);

const product =
products.find(p=>p.id===id);

if(!item || !product) return;

item.qty += change;

if(item.qty<=0){

cart =
cart.filter(i=>i.id!==id);

}

if(item.qty>product.stock){

item.qty=product.stock;

alert("Maximum available stock reached.");

}

saveCart();

updateCart();

renderCart();

}


function removeFromCart(id){

cart =
cart.filter(i=>i.id!==id);

saveCart();

updateCart();

renderCart();

}


/* =====================================
   TOTAL
===================================== */

function getTotal(){

let total=0;

cart.forEach(item=>{

const product =
products.find(p=>p.id===item.id);

if(product){

total +=
product.price * item.qty;

}

});

return total;

}


/* =====================================
   WHATSAPP ORDER
===================================== */

function whatsappOrder(){

if(cart.length===0){

alert("Your cart is empty.");

return;

}

const name =
document.getElementById("customerName")
.value.trim();

const phone =
document.getElementById("customerPhone")
.value.trim();

const address =
document.getElementById("customerAddress")
.value.trim();


if(!name || !phone || !address){

alert(
"Please fill Name, Mobile Number and Address."
);

return;

}


let message =
"🛍️ NEW ORDER\n\n";

message +=
"👤 Name: " + name + "\n";

message +=
"📞 Mobile: " + phone + "\n";

message +=
"📍 Address: " + address + "\n\n";

message +=
"Products:\n";


cart.forEach(item=>{

const product =
products.find(p=>p.id===item.id);

if(product){

message +=
product.name +
" × " +
item.qty +
" = ₹" +
(product.price * item.qty) +
"\n";

}

});


message +=
"\n💰 Total: ₹" + getTotal();


const whatsappURL =
"https://wa.me/" +
WHATSAPP_NUMBER +
"?text=" +
encodeURIComponent(message);


window.open(
whatsappURL,
"_blank"
);

}


/* =====================================
   PAY ON ORDER
===================================== */

function payOnOrder(){

if(cart.length===0){

alert("Your cart is empty.");

return;

}

const name =
document.getElementById("customerName")
.value.trim();

const phone =
document.getElementById("customerPhone")
.value.trim();


if(!name || !phone){

alert(
"Please enter your Name and Mobile Number first."
);

return;

}


const total = getTotal();


if(total<=0){

alert("Invalid payment amount.");

return;

}


/*
   UPI PAYMENT REQUEST

   pa = UPI ID
   pn = Store Name
   am = Cart Total
   cu = INR
*/

const upiLink =
"upi://pay" +
"?pa=" +
encodeURIComponent(UPI_ID) +
"&pn=" +
encodeURIComponent("My Online Store") +
"&am=" +
encodeURIComponent(total.toFixed(2)) +
"&cu=INR" +
"&tn=" +
encodeURIComponent(
"Order - " + name + " - " + phone
);


/*
   Open UPI / Google Pay
*/

window.location.href = upiLink;

}


/* =====================================
   ADMIN LOGIN
===================================== */

function openAdminLogin(){

document.getElementById("loginModal")
.style.display="block";

}


function adminLogin(){

const user =
document.getElementById("adminUser").value;

const pass =
document.getElementById("adminPass").value;


/*
   ADMIN LOGIN

   Username: admin
   Password: password
*/

if(
user==="admin" &&
pass==="password"
){

closeModal("loginModal");

document.getElementById("adminModal")
.style.display="block";

renderAdminProducts();

}else{

alert(
"Wrong username or password."
);

}

}


/* =====================================
   ADD PRODUCT
===================================== */

function addProduct(){

const name =
document.getElementById("pName")
.value.trim();

const price =
Number(
document.getElementById("pPrice")
.value
);

const stock =
Number(
document.getElementById("pStock")
.value
);

const image =
document.getElementById("pImage")
.value.trim();


if(
!name ||
!price ||
stock<0 ||
!image
){

alert(
"Please fill all product details."
);

return;

}


products.push({

id:Date.now(),

name:name,

price:price,

stock:stock,

image:image

});


saveProducts();

renderProducts();

renderAdminProducts();


document.getElementById("pName").value="";
document.getElementById("pPrice").value="";
document.getElementById("pStock").value="";
document.getElementById("pImage").value="";


alert(
"Product added successfully."
);

}


/* =====================================
   ADMIN PRODUCTS
===================================== */

function renderAdminProducts(){

const box =
document.getElementById("adminProducts");

box.innerHTML="";

products.forEach(p=>{

box.innerHTML += `

<div
style="
border-bottom:1px solid #ddd;
padding:10px 0
">

<b>${p.name}</b>

<br>

Price: ₹${p.price}

<br>

Stock: ${p.stock}

<button
class="action danger"
onclick="deleteProduct(${p.id})">

Delete

</button>

</div>

`;

});

}


/* =====================================
   DELETE PRODUCT
===================================== */

function deleteProduct(id){

if(
!confirm("Delete this product?")
){

return;

}

products =
products.filter(
p=>p.id!==id
);

cart =
cart.filter(
i=>products.some(
p=>p.id===i.id
)
);

saveProducts();

saveCart();

renderProducts();

updateCart();

renderAdminProducts();

}


/* =====================================
   CLOSE MODALS
===================================== */

function closeModal(id){

document.getElementById(id)
.style.display="none";

}


/* =====================================
   START WEBSITE
===================================== */

renderProducts();

updateCart();

</script>

</body>
</html>
